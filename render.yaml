# Render Blueprint — provisions the web service + managed Postgres described
# in README.md.
# https://render.com/docs/blueprint-spec



services:
  - type: web
    name: statworkforce-staging
    runtime: node
    plan: starter
    buildCommand: npm ci --no-audit --no-fund && npm run db:generate && npm run deploy:preflight && npm run build
    # Migrations are a release step, not a build side effect. Render runs this
    # against the new release before routing traffic to it.
    preDeployCommand: npm run db:migrate:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: statworkforce-staging-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      # Shared secret for the GitHub Actions daily cron
      # (.github/workflows/credential-sweep.yml) — must match the repo's
      # CRON_SECRET Actions secret. Generate with: openssl rand -base64 32
      - key: CRON_SECRET
        sync: false
      - key: DEPLOYMENT_TIER
        value: staging
      - key: CREDENTIAL_STORAGE_BUCKET
        sync: false
      - key: AWS_REGION
        value: us-west-2
      # Deliberately NOT setting NODE_ENV here: Render sets it to "production"
      # for the running service automatically, but declaring it as an envVar
      # also applies it during the build phase, which makes `npm install`
      # skip devDependencies (tailwindcss, @tailwindcss/postcss, typescript)
      # that `next build` needs. Learned this the hard way on the first deploy.

databases:
  - name: statworkforce-staging-db
    plan: basic-256mb
    databaseName: statworkforce_staging
    user: statworkforce
    # No public database ingress. Application and release commands use the
    # Render private network connection injected above.
    ipAllowList: []
