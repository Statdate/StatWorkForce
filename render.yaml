# Render Blueprint — provisions the web service + managed Postgres described
# in README.md.
# https://render.com/docs/blueprint-spec



services:
  - type: web
    name: statworkforce
    runtime: node
    plan: starter
    # Runs the migration on every deploy, so schema changes ship automatically
    # on push instead of needing a manual `prisma migrate deploy` each time.
    buildCommand: npm ci --no-audit --no-fund && npm run db:generate && npm run deploy:preflight && npm run db:migrate:deploy && npm run build
    startCommand: npm start
    envVars:
           # Neon connection string, set in the dashboard. Use Neon's DIRECT
      # endpoint, not the -pooler one: the datasource block has no directUrl,
      # so db:migrate:deploy above runs on this same URL, and PgBouncer in
      # transaction mode doesn't support the advisory locks Prisma takes.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      # Shared secret for the GitHub Actions daily cron
      # (.github/workflows/credential-sweep.yml) — must match the repo's
      # CRON_SECRET Actions secret. Generate with: openssl rand -base64 32
      - key: CRON_SECRET
        sync: false
      - key: DEPLOYMENT_TIER
        value: staging
      - key: CREDENTIAL_STORAGE_BUCKET
        sync: false
      - key: AWS_REGION
        value: us-west-2
      # Deliberately NOT setting NODE_ENV here: Render sets it to "production"
      # for the running service automatically, but declaring it as an envVar
      # also applies it during the build phase, which makes `npm install`
      # skip devDependencies (tailwindcss, @tailwindcss/postcss, typescript)
      # that `next build` needs. Learned this the hard way on the first deploy.
